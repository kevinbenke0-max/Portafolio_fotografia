<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instantes | Portafolio de Fotografía</title>
  
  <!-- Tipografías editoriales y elegantes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #0f0f0f;
      --card-bg: #181818;
      --text-main: #f5f5f7;
      --text-muted: #a1a1a6;
      --accent: #d4af37;
      --danger: #e74c3c;
      --font-title: 'Cormorant Garamond', serif;
      --font-body: 'Montserrat', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-body);
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* --- NAVEGACIÓN --- */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 50px;
      background: rgba(15, 15, 15, 0.9);
      backdrop-filter: blur(10px);
      z-index: 1000;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .logo {
      font-family: var(--font-title);
      font-size: 1.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-main);
      cursor: pointer;
    }

    .nav-links a, .nav-links button {
      background: none;
      border: none;
      color: var(--text-muted);
      text-decoration: none;
      margin-left: 25px;
      font-size: 0.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      font-family: var(--font-body);
      transition: color 0.3s;
    }

    .nav-links a:hover, .nav-links button:hover {
      color: var(--accent);
    }

    .btn-admin-nav {
      border: 1px solid rgba(212, 175, 55, 0.4) !important;
      padding: 6px 15px;
      border-radius: 2px;
      color: var(--accent) !important;
    }

    /* --- PORTADA PRINCIPAL --- */
    .hero {
      height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: linear-gradient(rgba(0,0,0,0.4), rgba(15,15,15,1)), 
                  url('https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
    }

    .hero-content { max-width: 800px; padding: 0 20px; }
    .hero-subtitle { font-size: 0.85rem; letter-spacing: 4px; text-transform: uppercase; color: var(--accent); margin-bottom: 15px; }
    .hero-title { font-family: var(--font-title); font-size: 4rem; font-weight: 300; letter-spacing: 3px; line-height: 1.1; margin-bottom: 25px; }

    .btn-hero {
      display: inline-block;
      padding: 12px 35px;
      border: 1px solid var(--accent);
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: all 0.3s;
      background: transparent;
      cursor: pointer;
    }
    .btn-hero:hover { background: var(--accent); color: #000; }

    /* --- SECCIONES Y ÁLBUMES --- */
    .section-title {
      text-align: center;
      font-family: var(--font-title);
      font-size: 2.8rem;
      font-weight: 300;
      letter-spacing: 2px;
      margin: 80px 0 40px;
    }

    .albums-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 30px;
      padding: 0 50px 80px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .album-card {
      position: relative;
      height: 450px;
      overflow: hidden;
      border-radius: 4px;
      background: var(--card-bg);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .album-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .album-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.1) 60%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 30px;
    }

    .album-card:hover img { transform: scale(1.05); }
    .album-category { font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); }
    .album-name { font-family: var(--font-title); font-size: 2rem; font-weight: 300; margin-top: 5px; }

    .btn-delete {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(231, 76, 60, 0.8);
      color: white;
      border: none;
      padding: 6px 12px;
      font-size: 0.7rem;
      letter-spacing: 1px;
      cursor: pointer;
      border-radius: 3px;
      display: none; /* Se muestra solo en modo admin */
      text-transform: uppercase;
    }

    /* --- PANEL DE ADMINISTRACIÓN --- */
    #admin-panel {
      display: none;
      padding: 130px 20px 80px;
      max-width: 700px;
      margin: 0 auto;
    }

    .admin-box {
      background: var(--card-bg);
      padding: 40px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .admin-box h2 {
      font-family: var(--font-title);
      font-size: 2.2rem;
      margin-bottom: 25px;
      color: var(--accent);
      font-weight: 300;
    }

    .form-group { margin-bottom: 20px; }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
      color: var(--text-muted);
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      background: #111;
      border: 1px solid #333;
      color: #fff;
      border-radius: 3px;
      font-family: var(--font-body);
      font-size: 0.9rem;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .btn-submit {
      width: 100%;
      background: var(--accent);
      color: #000;
      border: none;
      padding: 14px;
      font-weight: 500;
      letter-spacing: 2px;
      cursor: pointer;
      text-transform: uppercase;
      font-size: 0.8rem;
      margin-top: 10px;
      transition: background 0.3s;
    }

    .btn-submit:hover { background: #b8972b; }

    footer {
      text-align: center;
      padding: 40px 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.8rem;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    @media (max-width: 768px) {
      nav { padding: 20px; }
      .hero-title { font-size: 2.8rem; }
      .albums-grid { padding: 0 20px 80px; }
    }
  </style>
</head>
<body>

  <!-- Navegación -->
  <nav>
    <div class="logo" onclick="showPublicView()">Instantes</div>
    <div class="nav-links">
      <a href="#portadas" id="linkColecciones">Colecciones</a>
      <button class="btn-admin-nav" onclick="toggleAdminPanel()" id="adminBtnText">Panel Admin</button>
    </div>
  </nav>

  <!-- Vista Pública (Portafolio) -->
  <div id="public-view">
    <header class="hero">
      <div class="hero-content">
        <p class="hero-subtitle">Estudio de Fotografía</p>
        <h1 class="hero-title">Capturando la elegancia de tus recuerdos</h1>
        <a href="#portadas" class="btn-hero">Ver Colecciones</a>
      </div>
    </header>

    <section id="portadas">
      <h2 class="section-title">Colecciones Destacadas</h2>
      <div class="albums-grid" id="albumsContainer">
        <!-- Los álbumes se renderizan aquí dinámicamente -->
      </div>
    </section>
  </div>

  <!-- Panel de Gestión para la Fotógrafa -->
  <section id="admin-panel">
    <div class="admin-box">
      <h2>Gestión de Álbumes</h2>
      <form id="uploadForm" onsubmit="agregarAlbum(event)">
        <div class="form-group">
          <label>Título del Álbum / Sesión</label>
          <input type="text" id="albumTitle" placeholder="Ej: Boda Valentina & Lucas" required>
        </div>
        <div class="form-group">
          <label>Categoría</label>
          <input type="text" id="albumCategory" placeholder="Ej: Bodas, Retratos, Alta Costura" required>
        </div>
        <div class="form-group">
          <label>Enlace de la Foto de Portada</label>
          <input type="url" id="albumImage" placeholder="https://ejemplo.com/foto.jpg" required>
        </div>
        <button type="submit" class="btn-submit">Publicar Nuevo Álbum</button>
      </form>
    </div>
  </section>

  <footer>
    <p>© 2026 Fotografía Editorial. Todos los derechos reservados.</p>
  </footer>

  <script>
    // Base de datos inicial por defecto
    let albums = JSON.parse(localStorage.getItem('fotografia_albums')) || [
      { id: 1, title: 'Romance Urbano', category: 'Bodas & Eventos', image: 'https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=800&q=80' },
      { id: 2, title: 'Luz Studio', category: 'Retratos', image: 'https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?auto=format&fit=crop&w=800&q=80' },
      { id: 3, title: 'Alta Costura', category: 'Editorial', image: 'https://images.unsplash.com/photo-1469334031218-e382a71b716b?auto=format&fit=crop&w=800&q=80' }
    ];

    let isAdminMode = false;

    // Renderizar los álbumes en la pantalla
    function renderAlbums() {
      const container = document.getElementById('albumsContainer');
      container.innerHTML = '';

      albums.forEach(album => {
        const card = document.createElement('div');
        card.className = 'album-card';
        card.innerHTML = `
          <img src="${album.image}" alt="${album.title}">
          <div class="album-overlay">
            <span class="album-category">${album.category}</span>
            <h3 class="album-name">${album.title}</h3>
          </div>
          <button class="btn-delete" style="display: ${isAdminMode ? 'block' : 'none'}" onclick="eliminarAlbum(${album.id})">Eliminar</button>
        `;
        container.appendChild(card);
      });
    }

    // Alternar entre modo web pública y panel de administración
    function toggleAdminPanel() {
      isAdminMode = !isAdminMode;
      const publicView = document.getElementById('public-view');
      const adminPanel = document.getElementById('admin-panel');
      const adminBtn = document.getElementById('adminBtnText');
      const linkColecciones = document.getElementById('linkColecciones');

      if (isAdminMode) {
        publicView.style.display = 'none';
        adminPanel.style.display = 'block';
        adminBtn.textContent = 'Ver Sitio Web';
        linkColecciones.style.display = 'none';
      } else {
        adminPanel.style.display = 'none';
        publicView.style.display = 'block';
        adminBtn.textContent = 'Panel Admin';
        linkColecciones.style.display = 'inline';
        renderAlbums();
      }
      renderAlbums();
    }

    function showPublicView() {
      if (isAdminMode) toggleAdminPanel();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Agregar un nuevo álbum desde el formulario
    function agregarAlbum(event) {
      event.preventDefault();
      const title = document.getElementById('albumTitle').value;
      const category = document.getElementById('albumCategory').value;
      const image = document.getElementById('albumImage').value;

      const nuevoAlbum = {
        id: Date.now(),
        title,
        category,
        image
      };

      albums.unshift(nuevoAlbum); // Agrega al principio
      localStorage.setItem('fotografia_albums', JSON.stringify(albums));

      alert('¡Álbum publicado exitosamente!');
      document.getElementById('uploadForm').reset();
      toggleAdminPanel(); // Vuelve a la vista pública para ver el cambio
    }

    // Eliminar álbum (disponible solo en modo administrador)
    function eliminarAlbum(id) {
      if (confirm('¿Estás segura de que deseas eliminar este álbum?')) {
        albums = albums.filter(album => album.id !== id);
        localStorage.setItem('fotografia_albums', JSON.stringify(albums));
        renderAlbums();
      }
    }

    // Carga inicial
    renderAlbums();
  </script>
</body>
</html>
